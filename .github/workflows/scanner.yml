name: MiTV 24/7 Pro M3U Scanner

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
    scanner-job:
      runs-on: ubuntu-latest
      
      steps:
        - name: Checkout Repository
          uses: actions/checkout@v4

        - name: Setup Python 3.10
          uses: actions/setup-python@v5
          with:
            python-version: '3.10'

        - name: Install Dependencies
          run: |
            python -m pip install --upgrade pip
            pip install requests

        - name: Initialize Output File
          run: |
            touch found_playlists.txt

        - name: Execute Scanner Engine
          run: |
            python scanner.py

        - name: Commit & Push Results
          run: |
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add found_playlists.txt
            git diff --quiet && git diff --staged --quiet || (git commit -m "Auto: Updated M3U Playlists [MiTV Network Pro]" && git push)

        - name: Re-trigger for 24/7 Continuous Loop
          if: always()
          env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          run: |
            echo "Re-triggering workflow for 24/7 continuous operation..."
            gh workflow run "MiTV 24/7 Pro M3U Scanner"
